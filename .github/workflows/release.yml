name: Release Windows Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows green package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions
        shell: pwsh
        run: |
          $rootVersion = node -p "require('./package.json').version"
          $desktopVersion = node -p "require('./packages/desktop/package.json').version"
          $coreVersion = node -p "require('./packages/core/package.json').version"
          $httpVersion = node -p "require('./packages/http/package.json').version"
          $tagName = "${{ github.ref_name }}"

          if ($rootVersion -ne $desktopVersion -or $rootVersion -ne $coreVersion -or $rootVersion -ne $httpVersion) {
            throw "Package versions must match. root=$rootVersion desktop=$desktopVersion core=$coreVersion http=$httpVersion"
          }

          if ($tagName -ne "v$rootVersion") {
            throw "Release tag $tagName must match package version v$rootVersion"
          }

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm vitest --run

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build Windows 7z
        run: cd packages/desktop && pnpm exec electron-builder --config electron-builder.yml --win 7z

      - name: Collect release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $package = Get-ChildItem packages/desktop/release/d2-tools-win-x64-*.7z | Select-Object -First 1
          if (-not $package) {
            throw "Windows 7z artifact was not created"
          }
          Copy-Item $package.FullName release-artifacts/
          Get-ChildItem release-artifacts

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-tools-win-x64
          path: release-artifacts/*
          if-no-files-found: error

  publish-github:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate changelog section
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          node scripts/extract-changelog.mjs --version $version

      - name: Generate release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          node scripts/generate-release-notes.mjs --version $version --output release-notes.md

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: d2-tools-win-x64
          path: release-artifacts

      - name: Verify release artifact
        shell: pwsh
        run: |
          Get-ChildItem release-artifacts -Recurse
          $package = Get-ChildItem release-artifacts -Recurse -Filter 'd2-tools-win-x64-*.7z' | Select-Object -First 1
          if (-not $package) {
            throw "Downloaded release artifact does not contain d2-tools-win-x64-*.7z"
          }

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: d2-tools ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/d2-tools-win-x64-*.7z
          fail_on_unmatched_files: true
          prerelease: true
