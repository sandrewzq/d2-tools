name: Release Windows Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows green package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions
        shell: pwsh
        run: |
          $rootVersion = node -p "require('./package.json').version"
          $desktopVersion = node -p "require('./packages/desktop/package.json').version"
          $tagName = "${{ github.ref_name }}"

          if ($rootVersion -ne $desktopVersion) {
            throw "Root package version $rootVersion does not match desktop package version $desktopVersion"
          }

          if ($tagName -ne "v$rootVersion") {
            throw "Release tag $tagName must match package version v$rootVersion"
          }

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Windows 7z
        run: pnpm package:win

      - name: Collect release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $package = Get-ChildItem packages/desktop/release/d2-service-win-x64-*.7z | Select-Object -First 1
          if (-not $package) {
            throw "Windows 7z artifact was not created"
          }
          Copy-Item $package.FullName release-artifacts/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-service-win-x64
          path: release-artifacts/d2-service-win-x64-*.7z
          if-no-files-found: error

  publish-github:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: d2-service-win-x64
          path: release-artifacts

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_file="$(ls release-artifacts/d2-service-win-x64-*.7z | head -n 1)"

          cat > release-notes.md <<EOF
          Windows x64 绿色包，7z 格式。

          使用方式：
          1. 下载 7z。
          2. 用 7-Zip、Bandizip、WinRAR 等工具解压到任意目录。
          3. 双击 d2-service.exe。

          覆盖升级不会删除 %APPDATA%\\d2-service 里的本地配置、token 和缓存。
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$package_file" --clobber
          else
            gh release create "$TAG_NAME" "$package_file" \
              --title "d2-service $TAG_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
