name: Release Windows Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions
        shell: pwsh
        run: |
          $rootVersion = node -p "require('./package.json').version"
          $desktopVersion = node -p "require('./packages/desktop/package.json').version"
          $coreVersion = node -p "require('./packages/core/package.json').version"
          $httpVersion = node -p "require('./packages/http/package.json').version"
          $tagName = "${{ github.ref_name }}"
          $versionPattern = '^v' + [regex]::Escape($rootVersion) + '(-(beta|rc)\.\d+)?$'

          if ($rootVersion -ne $desktopVersion -or $rootVersion -ne $coreVersion -or $rootVersion -ne $httpVersion) {
            throw "Package versions must match. root=$rootVersion desktop=$desktopVersion core=$coreVersion http=$httpVersion"
          }

          if ($tagName -notmatch $versionPattern) {
            throw "Release tag $tagName must match v$rootVersion or a prerelease tag like v$rootVersion-beta.1 / v$rootVersion-rc.1"
          }

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Windows NSIS installer
        run: cd packages/desktop && pnpm exec electron-builder --config electron-builder.yml --win nsis --publish never

      - name: Collect release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $installer = Get-ChildItem packages/desktop/release/d2-tools-setup-*.exe | Select-Object -First 1
          $latest = Get-ChildItem packages/desktop/release/latest.yml | Select-Object -First 1
          $blockmap = Get-ChildItem packages/desktop/release/*.blockmap | Select-Object -First 1
          if (-not $installer) {
            throw "Windows NSIS installer was not created"
          }
          if (-not $latest) {
            throw "latest.yml updater metadata was not created"
          }
          if (-not $blockmap) {
            throw "Installer blockmap was not created"
          }
          $version = "${{ github.ref_name }}".Substring(1)
          $latestText = Get-Content $latest.FullName -Raw
          if ($latestText -notmatch ("version:\s*" + [regex]::Escape($version))) {
            throw "latest.yml version does not match $version"
          }
          if ($latestText -notmatch [regex]::Escape($installer.Name)) {
            throw "latest.yml does not reference $($installer.Name)"
          }
          if ($blockmap.Name -ne ($installer.Name + ".blockmap")) {
            throw "Installer blockmap $($blockmap.Name) does not match $($installer.Name)"
          }
          Copy-Item $installer.FullName release-artifacts/
          Copy-Item $latest.FullName release-artifacts/
          Copy-Item $blockmap.FullName release-artifacts/
          Get-ChildItem release-artifacts

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-tools-setup
          path: release-artifacts/*
          if-no-files-found: error

  publish-github:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate changelog section
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          node scripts/extract-changelog.mjs --version $version

      - name: Generate release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          node scripts/generate-release-notes.mjs --version $version --output release-notes.md

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: d2-tools-setup
          path: release-artifacts

      - name: Verify release artifact
        shell: pwsh
        run: |
          Get-ChildItem release-artifacts -Recurse
          $installer = Get-ChildItem release-artifacts -Recurse -Filter 'd2-tools-setup-*.exe' | Select-Object -First 1
          $latest = Get-ChildItem release-artifacts -Recurse -Filter 'latest.yml' | Select-Object -First 1
          $blockmap = Get-ChildItem release-artifacts -Recurse -Filter '*.blockmap' | Select-Object -First 1
          if (-not $installer) {
            throw "Downloaded release artifact does not contain d2-tools-setup-*.exe"
          }
          if (-not $latest) {
            throw "Downloaded release artifact does not contain latest.yml"
          }
          if (-not $blockmap) {
            throw "Downloaded release artifact does not contain *.blockmap"
          }

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: d2-tools ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/d2-tools-setup-*.exe
            release-artifacts/latest.yml
            release-artifacts/*.blockmap
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
