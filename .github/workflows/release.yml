name: Release Windows Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows green package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions
        shell: pwsh
        run: |
          $rootVersion = node -p "require('./package.json').version"
          $desktopVersion = node -p "require('./packages/desktop/package.json').version"
          $coreVersion = node -p "require('./packages/core/package.json').version"
          $httpVersion = node -p "require('./packages/http/package.json').version"
          $tagName = "${{ github.ref_name }}"

          if ($rootVersion -ne $desktopVersion -or $rootVersion -ne $coreVersion -or $rootVersion -ne $httpVersion) {
            throw "Package versions must match. root=$rootVersion desktop=$desktopVersion core=$coreVersion http=$httpVersion"
          }

          if ($tagName -ne "v$rootVersion") {
            throw "Release tag $tagName must match package version v$rootVersion"
          }

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Windows 7z
        run: pnpm package:win

      - name: Collect release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $package = Get-ChildItem packages/desktop/release/d2-tools-win-x64-*.7z | Select-Object -First 1
          if (-not $package) {
            throw "Windows 7z artifact was not created"
          }
          Copy-Item $package.FullName release-artifacts/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-tools-win-x64
          path: release-artifacts/d2-tools-win-x64-*.7z
          if-no-files-found: error

  publish-github:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: d2-tools-win-x64
          path: release-artifacts

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: d2-tools ${{ github.ref_name }}
          files: release-artifacts/d2-tools-win-x64-*.7z
          fail_on_unmatched_files: true
          body: |
            Windows x64 绿色包，7z 格式。

            使用方式：
            1. 下载 d2-tools-win-x64-*.7z。
            2. 用 7-Zip、Bandizip、WinRAR 等工具解压到任意目录。
            3. 双击 d2-tools.exe。

            覆盖升级不会删除 %APPDATA%\d2-tools 里的本地配置、token 和缓存。
            从旧版 d2-service 升级时，首次启动会复制 %APPDATA%\d2-service 到 %APPDATA%\d2-tools。