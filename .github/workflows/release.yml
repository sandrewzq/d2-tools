name: Release Tauri Windows Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Tauri Windows bundle
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches root package version
        shell: pwsh
        run: |
          $rootVersion = node -p "require('./package.json').version"
          $tagName = "${{ github.ref_name }}"

          if ($tagName -ne "v$rootVersion") {
            throw "Release tag $tagName must match package version v$rootVersion"
          }

      - name: Check docs
        run: pnpm docs:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Tauri Windows bundle
        run: pnpm --filter @d2-tools/desktop package:desktop

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $bundleDir = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installers = Get-ChildItem $bundleDir -Filter "*.exe" -ErrorAction SilentlyContinue

          if (-not $installers) {
            throw "Tauri Windows installer was not created under $bundleDir"
          }

          Copy-Item $installers.FullName release-artifacts/
          Get-ChildItem release-artifacts

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2-tools-tauri-windows
          path: release-artifacts/*
          if-no-files-found: error

  publish-github:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate changelog section
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          node scripts/extract-changelog.mjs --version $version

      - name: Generate release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          node scripts/generate-release-notes.mjs --version $version --output release-notes.md

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: d2-tools-tauri-windows
          path: release-artifacts

      - name: Verify release artifact
        shell: pwsh
        run: |
          Get-ChildItem release-artifacts -Recurse
          $installer = Get-ChildItem release-artifacts -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Downloaded release artifact does not contain a Tauri Windows installer"
          }

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: d2-tools ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-artifacts/*.exe
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
