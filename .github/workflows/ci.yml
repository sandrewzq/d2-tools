name: CI

on:
  push:
    branches:
      - main
      - master
      - codex/**
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Verify shared Shell prototype contract
        run: pnpm visual:shell-contract
        env:
          D2_VISUAL_SKIP_BUILD: "1"

      - name: Upload shared Shell visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-shell-visual-contract
          path: .local-data/tmp/visual/shell-contract
          if-no-files-found: ignore

      - name: Run typecheck
        run: pnpm typecheck
