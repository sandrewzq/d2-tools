name: CI

on:
  push:
    branches:
      - main
      - master
      - codex/**
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 拆成独立 step 并加 if: always()：一次 push 能看到全部失败，
      # 不用修一个推一次。原先合成一条 run: pnpm test，挂在第一步就看不到后面。
      - name: Docs check
        run: pnpm docs:check

      - name: Build (typecheck)
        run: pnpm build

      - name: Behavior tests
        if: always()
        run: pnpm test:behavior

      - name: Quality checks
        if: always()
        run: pnpm test:quality

      - name: Architecture tests
        if: always()
        run: pnpm test:architecture

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Verify shared Shell visual contract
        run: pnpm visual:shell-contract
        env:
          D2_VISUAL_SKIP_BUILD: "1"

      - name: Upload shared Shell visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-shell-visual-contract
          path: .local-data/tmp/visual/shell-contract
          if-no-files-found: ignore

      - name: Run typecheck
        run: pnpm typecheck:ci
