appId: local.d2-tools.desktop
productName: d2-tools
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - "dist/**/*.js"
  - "dist/**/*.cjs"
  - "dist/**/*.mjs"
  - "dist/renderer/**"
  - "package.json"
asar: true
compression: maximum
win:
  signAndEditExecutable: false
  target:
    - target: 7z
      arch:
        - x64
artifactName: "d2-tools-win-x64-${version}.${ext}"
