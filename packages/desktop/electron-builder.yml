appId: local.d2-tools.desktop
productName: d2-tools
icon: build/icon.ico
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - "dist/**/*.js"
  - "dist/**/*.cjs"
  - "dist/**/*.mjs"
  - "dist/renderer/**"
  - "package.json"
asar: true
compression: maximum
publish:
  provider: github
  owner: sandrewzq
  repo: d2-tools
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
artifactName: "d2-tools-setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: "d2-tools"
  uninstallDisplayName: "d2-tools"
  include: build/installer.nsh
