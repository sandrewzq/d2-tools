<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仄商人分层库存原型</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0b0d10;
      --sidebar: #101318;
      --panel: #15191f;
      --panel-subtle: #1a1f26;
      --panel-strong: #20262e;
      --line: #2d343e;
      --line-strong: #46515f;
      --text: #edf1f5;
      --body: #c9d0d8;
      --muted: #8f99a5;
      --gold: #d5aa53;
      --gold-soft: #2c2519;
      --blue: #6bbcf7;
      --green: #6fc49a;
      --red: #ef8d7e;
      --shadow: 0 8px 24px rgb(0 0 0 / 0.24);
      --radius: 6px;
      --item-height: 66px;
      font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--page);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--body);
      background: var(--page);
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 8px;
      left: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      color: #07111b;
      background: var(--blue);
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .app {
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr);
      min-height: 100vh;
    }

    .titlebar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      padding: 0 14px 0 18px;
      border-bottom: 1px solid var(--line);
      background: #0e1115;
    }

    .brand,
    .titlebar-actions,
    .account-chip,
    .meta-row,
    .section-heading,
    .rank-head,
    .offer-cost,
    .vendor-meta,
    .status-line {
      display: flex;
      align-items: center;
    }

    .brand {
      gap: 10px;
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--gold) 70%, var(--line));
      border-radius: 50%;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 14px;
    }

    .titlebar-actions {
      gap: 8px;
    }

    .account-chip {
      gap: 7px;
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
      background: var(--panel);
      font-size: 12px;
    }

    .account-chip strong {
      color: var(--text);
      font-weight: 650;
    }

    .icon-button,
    .text-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      min-height: 32px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
      cursor: pointer;
      transition: 140ms ease;
      transition-property: border-color, background-color, color, transform;
    }

    .icon-button:hover,
    .text-button:hover {
      border-color: var(--line-strong);
      background: var(--panel-strong);
    }

    .icon-button:active,
    .text-button:active,
    .offer:active {
      transform: translateY(1px);
    }

    .shell {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      min-height: 0;
    }

    .primary-nav {
      position: sticky;
      top: 44px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      height: calc(100vh - 44px);
      padding: 10px 8px;
      border-right: 1px solid var(--line);
      background: var(--sidebar);
    }

    .primary-nav nav {
      display: grid;
      gap: 4px;
    }

    .nav-item {
      display: grid;
      gap: 4px;
      place-items: center;
      min-height: 52px;
      padding: 6px 4px;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-item:hover {
      color: var(--text);
      background: var(--panel-subtle);
    }

    .nav-item.is-active {
      border-color: color-mix(in srgb, var(--gold) 40%, var(--line));
      color: var(--text);
      background: var(--gold-soft);
    }

    .nav-item.is-active svg {
      color: var(--gold);
    }

    .nav-bottom {
      margin-top: auto;
    }

    .workspace {
      display: grid;
      grid-template-columns: 226px minmax(0, 1fr);
      min-width: 0;
    }

    .vendor-rail {
      position: sticky;
      top: 44px;
      height: calc(100vh - 44px);
      padding: 18px 12px;
      border-right: 1px solid var(--line);
      background: #12161b;
    }

    .rail-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 4px 12px;
    }

    .rail-heading h2 {
      margin: 0;
      color: var(--text);
      font-size: 15px;
    }

    .rail-heading span,
    .rail-section-title,
    .eyebrow,
    .section-heading span,
    .offer-type,
    .reward-level,
    .source-note,
    .vendor-meta,
    .tab-count {
      color: var(--muted);
      font-size: 11px;
    }

    .rail-section-title {
      display: block;
      padding: 8px 6px;
      font-weight: 700;
    }

    .vendor-row {
      display: grid;
      gap: 4px;
      width: 100%;
      min-height: 60px;
      padding: 10px;
      border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line));
      border-radius: var(--radius);
      color: var(--body);
      background: var(--gold-soft);
      text-align: left;
      cursor: pointer;
    }

    .vendor-row strong {
      color: var(--text);
      font-size: 14px;
    }

    .vendor-row span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .rail-summary {
      display: grid;
      gap: 8px;
      margin-top: 18px;
      padding: 12px 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .rail-summary strong {
      color: var(--green);
      font-weight: 650;
    }

    main {
      min-width: 0;
    }

    .content {
      width: min(100%, 1480px);
      min-height: calc(100vh - 44px);
      padding: 22px 24px 64px;
      margin: 0 auto;
    }

    .vendor-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      display: block;
      margin-bottom: 5px;
      color: var(--gold);
      font-weight: 700;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: 28px;
      font-weight: 650;
      line-height: 1.2;
    }

    .vendor-description {
      max-width: 760px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .vendor-meta {
      flex-wrap: wrap;
      gap: 7px 12px;
      margin-top: 11px;
    }

    .vendor-meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .header-actions {
      display: grid;
      grid-template-columns: auto auto;
      gap: 8px;
    }

    .text-button {
      gap: 7px;
      min-height: 36px;
      color: var(--body);
      font-size: 12px;
      font-weight: 650;
    }

    .context-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .search-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .search-panel[hidden] {
      display: none;
    }

    .search-field {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .search-field input {
      width: 100%;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text);
      background: #0d1014;
    }

    .search-field input::placeholder {
      color: #66717e;
    }

    .status-line {
      min-width: 0;
      gap: 8px;
      color: var(--body);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgb(111 196 154 / 0.12);
    }

    .context-bar > span:last-child {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .panel {
      padding-top: 22px;
    }

    .panel + .panel {
      margin-top: 24px;
      border-top: 1px solid var(--line);
    }

    #child-vendor-sections {
      margin-top: 28px;
      border-top: 1px solid var(--line);
    }

    .section-heading {
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      min-height: 38px;
      margin-bottom: 12px;
      padding-bottom: 9px;
      border-bottom: 1px solid color-mix(in srgb, var(--gold) 48%, var(--line));
    }

    .section-heading h2,
    .column-heading h3,
    .rank-head h3 {
      margin: 0;
      color: var(--text);
      font-size: 18px;
    }

    .section-heading-main {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .rank-head h3 {
      font-size: 16px;
    }

    .section-kicker {
      color: var(--gold) !important;
      font-size: 10px !important;
      font-weight: 700;
    }

    .section-description {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .section-summary {
      display: grid;
      justify-items: end;
      gap: 2px;
      min-width: 92px;
      padding-left: 14px;
      border-left: 1px solid var(--line);
    }

    .section-summary strong {
      color: var(--text);
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    .weekly-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(148px, 1fr));
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .offer {
      position: relative;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 10px;
      min-width: 0;
      min-height: var(--item-height);
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--body);
      background: var(--panel);
      text-align: left;
      cursor: pointer;
      transition: 140ms ease;
      transition-property: border-color, background-color, transform;
    }

    .offer:hover {
      border-color: color-mix(in srgb, var(--gold) 45%, var(--line-strong));
      background: var(--panel-strong);
    }

    .weekly-grid .offer {
      grid-template-columns: 58px minmax(0, 1fr);
      min-height: 96px;
      padding: 10px;
      border-top-color: color-mix(in srgb, var(--gold) 58%, var(--line));
    }

    .offer-icon {
      position: relative;
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--gold) 52%, var(--line));
      border-radius: 4px;
      background: var(--gold-soft);
      color: var(--gold);
      font-weight: 700;
    }

    .weekly-grid .offer-icon {
      width: 58px;
      height: 58px;
    }

    .offer-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .offer-icon img.is-contain {
      padding: 6px;
      object-fit: contain;
    }

    .offer-body {
      display: grid;
      align-content: center;
      min-width: 0;
    }

    .offer-name {
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .offer-type {
      overflow: hidden;
      margin-top: 2px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .offer-cost {
      gap: 5px;
      margin-top: 7px;
      color: var(--gold);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .cost-icon {
      width: 17px;
      height: 17px;
      object-fit: contain;
    }

    .quantity-badge {
      position: absolute;
      right: 8px;
      bottom: 7px;
      display: inline-grid;
      min-width: 25px;
      height: 19px;
      padding: 0 5px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--body);
      background: rgb(8 10 13 / 0.82);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .inventory-columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }

    .inventory-column {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #11151a;
      box-shadow: var(--shadow);
    }

    .inventory-rows {
      display: grid;
      gap: 24px;
      min-width: 0;
    }

    .inventory-row {
      display: grid;
      gap: 9px;
      min-width: 0;
    }

    .inventory-row-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 30px;
      padding-bottom: 7px;
      border-bottom: 1px solid color-mix(in srgb, var(--text) 52%, var(--line));
    }

    .inventory-row-heading h3 {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
    }

    .inventory-row-count {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .inventory-row-track {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 142px;
      gap: 8px;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .inventory-row-track .offer {
      grid-template-columns: 48px minmax(0, 1fr);
      min-height: 86px;
      padding: 8px;
      background: var(--panel-subtle);
    }

    .inventory-row-track .offer-icon {
      width: 48px;
      height: 48px;
    }

    .inventory-row-track .offer-name {
      font-size: 12px;
    }

    .inventory-row-track .offer-type,
    .inventory-row-track .offer-cost {
      font-size: 10px;
    }

    .column-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 54px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .column-heading div {
      min-width: 0;
    }

    .column-heading h3 {
      overflow: hidden;
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .column-heading p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .column-count {
      display: inline-grid;
      min-width: 28px;
      height: 25px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--gold);
      background: var(--gold-soft);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .offer-list {
      display: grid;
      gap: 7px;
      padding: 8px;
    }

    .offer-list .offer {
      grid-template-columns: 48px minmax(0, 1fr);
      min-height: 68px;
      padding: 8px;
      background: var(--panel-subtle);
    }

    .offer-list .offer-icon {
      width: 48px;
      height: 48px;
    }

    .offer-list .offer-cost {
      margin-top: 4px;
    }

    .loyalty-card {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 14px;
      min-height: 126px;
      padding: 16px;
      border: 1px solid color-mix(in srgb, var(--gold) 42%, var(--line));
      border-radius: var(--radius);
      background: var(--gold-soft);
    }

    .loyalty-card .offer-icon {
      width: 72px;
      height: 72px;
    }

    .loyalty-card h3 {
      margin: 0;
      color: var(--text);
      font-size: 15px;
    }

    .loyalty-card p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .rank-card {
      display: grid;
      grid-template-columns: minmax(210px, 0.34fr) minmax(0, 1fr);
      gap: 22px;
      align-items: center;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .rank-head {
      min-height: 96px;
      padding-right: 22px;
      border-right: 1px solid var(--line);
    }

    .rank-head,
    .xur-row-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .rank-number {
      color: var(--gold);
      font-size: 28px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 8px;
      margin-top: 7px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #0c0f13;
    }

    .progress-track span {
      display: block;
      width: 88.2%;
      height: 100%;
      background: var(--gold);
    }

    .rank-card dl {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 14px 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }

    .rank-card dl > div {
      display: grid;
      gap: 3px;
    }

    .rank-card dt {
      color: var(--muted);
    }

    .rank-card dd {
      margin: 0;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .xur-offer-rows {
      display: grid;
      gap: 18px;
      margin-top: 18px;
    }

    .xur-offer-row {
      display: grid;
      gap: 9px;
      min-width: 0;
    }

    .xur-row-heading {
      min-height: 30px;
      padding-bottom: 7px;
      border-bottom: 2px solid color-mix(in srgb, var(--gold) 48%, var(--line));
    }

    .xur-row-heading h3 {
      margin: 0;
      color: var(--text);
      font-size: 15px;
    }

    .xur-row-heading span {
      color: var(--muted);
      font-size: 11px;
    }

    .reward-track {
      display: grid;
      grid-template-columns: repeat(7, minmax(122px, 1fr));
      gap: 8px;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .reward {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      grid-template-areas:
        "icon name"
        "icon level"
        "icon state";
      gap: 2px 9px;
      align-items: center;
      min-width: 0;
      min-height: 86px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .reward.is-current {
      background: var(--gold-soft);
    }

    .reward-level {
      grid-area: level;
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .reward .offer-icon {
      grid-area: icon;
      width: 48px;
      height: 48px;
    }

    .reward-name {
      grid-area: name;
      overflow: hidden;
      color: var(--text);
      font-size: 12px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reward-state {
      grid-area: state;
      color: var(--muted);
      font-size: 10px;
    }

    .reward.is-current .reward-state {
      color: var(--gold);
    }

    .source-note {
      margin: 18px 0 0;
      line-height: 1.6;
    }

    .loading-layer {
      display: none;
      gap: 10px;
    }

    body.is-loading .panel > :not(.loading-layer) {
      display: none;
    }

    body.is-loading .loading-layer {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    body.is-loading .status-dot {
      background: var(--blue);
      box-shadow: 0 0 0 3px rgb(107 188 247 / 0.12);
    }

    .skeleton {
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, transparent 0%, rgb(255 255 255 / 0.035) 48%, transparent 100%),
        var(--panel);
      background-size: 240% 100%;
      animation: shimmer 1.3s ease-in-out infinite;
    }

    .tweaks {
      position: fixed;
      z-index: 40;
      right: 16px;
      bottom: 16px;
    }

    .tweak-panel {
      position: absolute;
      right: 0;
      bottom: 42px;
      display: none;
      width: 220px;
      padding: 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #15191f;
      box-shadow: var(--shadow);
    }

    .tweaks.is-open .tweak-panel {
      display: grid;
      gap: 12px;
    }

    .tweak-panel strong {
      color: var(--text);
      font-size: 12px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #0e1115;
    }

    .segmented button {
      min-height: 30px;
      border: 0;
      border-radius: 3px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }

    .segmented button[aria-pressed="true"] {
      color: var(--text);
      background: var(--panel-strong);
    }

    body.is-compact {
      --item-height: 58px;
    }

    body.is-compact .content {
      padding-top: 16px;
    }

    body.is-compact .offer-list {
      gap: 4px;
      padding: 6px;
    }

    body.is-compact .offer-list .offer {
      grid-template-columns: 42px minmax(0, 1fr);
      min-height: 58px;
      padding: 6px;
    }

    body.is-compact .offer-list .offer-icon {
      width: 42px;
      height: 42px;
    }

    @keyframes shimmer {
      from { background-position: 110% 0; }
      to { background-position: -110% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 1180px) {
      .weekly-grid {
        grid-template-columns: repeat(8, minmax(148px, 1fr));
      }

      .inventory-columns {
        grid-template-columns: 1fr;
      }

      .offer-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .rank-card {
        grid-template-columns: 1fr;
      }

      .rank-head {
        min-height: auto;
        padding-right: 0;
        padding-bottom: 14px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }

    @media (max-width: 880px) {
      .shell {
        grid-template-columns: 64px minmax(0, 1fr);
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .vendor-rail {
        position: static;
        height: auto;
        padding: 10px 14px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .rail-heading,
      .rail-section-title,
      .rail-summary {
        display: none;
      }

      .vendor-row {
        min-height: 44px;
        padding: 7px 10px;
      }

      .content {
        min-height: auto;
        padding: 18px 16px 64px;
      }

    }

    @media (max-width: 660px) {
      .titlebar {
        padding-left: 12px;
      }

      .account-chip span,
      .brand span:last-child,
      .nav-item span {
        display: none;
      }

      .shell {
        grid-template-columns: 48px minmax(0, 1fr);
      }

      .primary-nav {
        padding: 8px 4px;
      }

      .nav-item {
        min-height: 44px;
      }

      .vendor-header,
      .context-bar,
      .search-panel {
        grid-template-columns: 1fr;
      }

      .context-bar > span:last-child {
        text-align: left;
      }

      .header-actions {
        grid-template-columns: auto;
        justify-content: start;
      }

      .offer-list,
      body.is-loading .loading-layer {
        grid-template-columns: 1fr;
      }

      .weekly-grid .offer {
        min-height: 96px;
      }

      .rank-card dl {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>

得。","icon":"/common/destiny2_content/icons/dea2a35badf7466d4c2c2697ce6e8d87.jpg","itemType":"材料","tierType":"传说"}},"currencyBalances":{"800069450":69}};

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function image(path, name, contain = false) {
      const className = contain ? " class=\"is-contain\"" : "";
      const fallback = escapeHtml(String(name || "?").slice(0, 1));
      if (!path) return `<span>${fallback}</span>`;
      return `<img${className} src="${bungie + path}" alt="" width="58" height="58" loading="lazy" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>${fallback}</span>`;
    }

    function categoryDefinition(vendorHash, displayCategoryIndex) {
      return xurLiveData.vendorDefinitions[String(vendorHash)]?.displayCategories?.[displayCategoryIndex]
        ?? { index: displayCategoryIndex, identifier: "", name: "其他" };
    }

    function offerFromSale(vendorHash, vendorItemIndex) {
      const vendor = xurLiveData.vendors[String(vendorHash)];
      const sale = vendor?.saleItems?.[String(vendorItemIndex)];
      if (!sale) return null;
      const definition = xurLiveData.itemDefinitions[String(sale.itemHash)] ?? {};
      const vendorDefinition = xurLiveData.vendorDefinitions[String(vendorHash)] ?? {};
      return {
        vendorHash: Number(vendorHash),
        vendorItemIndex,
        itemHash: sale.itemHash,
        name: definition.name || String(sale.itemHash),
        description: definition.description || "",
        icon: definition.icon,
        itemType: definition.itemType || "",
        tierType: definition.tierType || "",
        quantity: sale.quantity ?? 1,
        costs: (sale.costs ?? []).map(cost => ({
          ...cost,
          definition: xurLiveData.itemDefinitions[String(cost.itemHash)] ?? {}
        })),
        failureIndexes: sale.failureIndexes ?? [],
        failureMessages: (sale.failureIndexes ?? []).map(index => vendorDefinition.failureStrings?.[index] || "无法购买"),
        saleStatus: sale.saleStatus ?? 0,
        stats: vendor?.stats?.[String(vendorItemIndex)] ?? {},
        socketPlugHashes: vendor?.sockets?.[String(vendorItemIndex)] ?? []
      };
    }

    function activeCategories(vendorHash) {
      const vendor = xurLiveData.vendors[String(vendorHash)];
      return (vendor?.categories ?? [])
        .map(category => {
          const definition = categoryDefinition(vendorHash, category.displayCategoryIndex);
          return {
            index: category.displayCategoryIndex,
            identifier: definition.identifier || "",
            name: definition.name || "其他",
            items: (category.itemIndexes ?? [])
              .map(index => offerFromSale(vendorHash, index))
              .filter(Boolean)
          };
        })
        .filter(category => category.items.length)
        .sort((left, right) => left.index - right.index);
    }

    function costHtml(item) {
      if (!item.costs.length) return `<span class="offer-cost">无需货币</span>`;
      return item.costs.map(cost => {
        const costName = cost.definition.name || String(cost.itemHash);
        const costIcon = cost.definition.icon || coinIcon;
        return `<span class="offer-cost"><img class="cost-icon" src="${bungie + costIcon}" alt="" width="17" height="17" loading="lazy">${cost.quantity.toLocaleString("zh-CN")} ${escapeHtml(costName)}</span>`;
      }).join("");
    }

    function offerHtml(item, options = {}) {
      const quantityHtml = item.quantity > 1
        ? `<span class="quantity-badge">× ${item.quantity.toLocaleString("zh-CN")}</span>`
        : "";
      const contain = options.contain
        ?? /水晶|货币|材料|容器/.test(`${item.itemType} ${item.name}`);
      const detailSummary = `${Object.keys(item.stats).length} 项属性 · ${item.socketPlugHashes.length} 个插槽`;
      return `<button class="offer" type="button" aria-label="查看${escapeHtml(item.name)}资料库详情" data-item="${escapeHtml(item.name)}" title="${detailSummary}">
        <span class="offer-icon">${image(item.icon, item.name, contain)}</span>
        <span class="offer-body"><span class="offer-name">${escapeHtml(item.name)}</span><span class="offer-type">${escapeHtml(item.itemType || item.tierType || "异域物品")}</span>${costHtml(item)}</span>
        ${quantityHtml}
      </button>`;
    }

    function inventoryRowHtml(category) {
      return `<section class="inventory-row" data-category="${escapeHtml(category.identifier)}">
        <div class="inventory-row-heading"><h3>${escapeHtml(category.name)}</h3><span class="inventory-row-count">${category.items.length} 件</span></div>
        <div class="inventory-row-track">${category.items.map(item => offerHtml(item)).join("")}</div>
      </section>`;
    }

    function rewardLevel(item, index, progression) {
      for (const message of item.failureMessages) {
        const required = message.match(/需要等级\s*(\d+)/);
        if (required) return Number(required[1]);
        const reset = message.match(/完成等级\s*(\d+)/);
        if (reset) return Number(reset[1]) + 1;
      }
      if (index === 0) return 1;
      return Math.min(progression.levelCap + 1, index + 1);
    }

    function rewardState(item, level, progression) {
      if (!item.failureIndexes.length && item.saleStatus === 0) return "可领取";
      if (level === progression.level) return "当前等级";
      if (level < progression.level) return "已领取";
      return "未解锁";
    }

    const definitionEntries = Object.entries(xurLiveData.vendorDefinitions);
    const rootEntry = definitionEntries.find(([, candidate]) =>
      definitionEntries.some(([, child]) =>
        child.vendorIdentifier !== candidate.vendorIdentifier
        && child.vendorIdentifier.startsWith(`${candidate.vendorIdentifier}_`)
      )
    ) ?? definitionEntries[0];
    const [rootHash, rootDefinition] = rootEntry;
    const rootVendor = xurLiveData.vendors[rootHash];
    const rootCategories = activeCategories(rootHash);
    const progression = rootVendor.vendor.progression;
    const rankCategory = rootCategories.find(category => category.identifier.includes("rank_rewards"));
    const weeklyCategory = rootCategories
      .filter(category => category !== rankCategory)
      .filter(category => category.items.some(item => item.costs.length || item.itemType))
      .sort((left, right) => right.items.length - left.items.length)[0];
    const rewardItems = rankCategory?.items ?? [];
    const weeklyItems = weeklyCategory?.items ?? [];
    const rewardModels = rewardItems.map((item, index) => ({
      item,
      level: rewardLevel(item, index, progression)
    }));

    document.getElementById("vendor-name").textContent = rootDefinition.name;
    document.getElementById("vendor-description").textContent = rootDefinition.description;
    document.getElementById("capture-time").textContent = `抓取：${new Date(xurLiveData.capturedAt).toLocaleString("zh-CN")}`;
    document.getElementById("refresh-time").textContent = rootVendor.vendor.nextRefreshDate
      ? `刷新：${new Date(rootVendor.vendor.nextRefreshDate).toLocaleString("zh-CN")}`
      : "等待刷新时间";
    document.getElementById("rank-context").textContent = `${rootDefinition.name}等级 ${progression.level} / ${progression.levelCap} · 距离下一等级 ${progression.progressToNextLevel} 点`;
    document.getElementById("rank-section-meta").textContent = `等级上限 ${progression.levelCap} · ${rewardItems.length} 个奖励`;
    document.getElementById("rank-number").textContent = progression.level;
    const currentStepProgress = Math.max(0, progression.nextLevelAt - progression.progressToNextLevel);
    const progressPercent = progression.nextLevelAt ? currentStepProgress / progression.nextLevelAt * 100 : 0;
    document.getElementById("rank-current-progress").textContent = `本级进度 ${currentStepProgress} / ${progression.nextLevelAt}`;
    document.getElementById("rank-next-level").textContent = `累计进度 ${progression.currentProgress}`;
    document.getElementById("rank-progress-track").setAttribute("aria-label", `等级进度 ${Math.round(progressPercent)}%`);
    document.querySelector("#rank-progress-track span").style.width = `${progressPercent}%`;
    document.getElementById("rank-remaining").textContent = `${progression.progressToNextLevel} 点`;
    document.getElementById("rank-next-reward").textContent = rewardModels.find(reward => reward.level > progression.level)?.level ?? progression.levelCap;
    document.getElementById("rank-cap").textContent = progression.levelCap;
    document.getElementById("reward-count").textContent = `${rewardItems.length} 个奖励节点`;
    document.getElementById("weekly-count").textContent = `当前角色 ${weeklyItems.length} 件`;
    document.getElementById("weekly-grid").innerHTML = weeklyItems.map(item => offerHtml(item)).join("");
    document.getElementById("reward-track").innerHTML = rewardModels.map(({ item, level }) => {
      const state = rewardState(item, level, progression);
      return `<div class="reward${state === "当前等级" ? " is-current" : ""}"><span class="reward-level">等级 ${level}</span><span class="offer-icon">${image(item.icon, item.name, true)}</span><span class="reward-name">${escapeHtml(item.name)}</span><span class="reward-state">${state}</span></div>`;
    }).join("");

    const childEntries = definitionEntries
      .filter(([hash, definition]) => hash !== rootHash && definition.vendorIdentifier.startsWith(`${rootDefinition.vendorIdentifier}_`));
    const navigationOrder = rootCategories
      .flatMap(category => category.items)
      .map(item => item.name);
    childEntries.sort((left, right) => {
      const leftIndex = navigationOrder.indexOf(left[1].name);
      const rightIndex = navigationOrder.indexOf(right[1].name);
      return (leftIndex < 0 ? Number.MAX_SAFE_INTEGER : leftIndex)
        - (rightIndex < 0 ? Number.MAX_SAFE_INTEGER : rightIndex);
    });
    document.getElementById("child-vendor-sections").innerHTML = childEntries.map(([hash, definition], index) => {
      const categories = activeCategories(hash);
      const itemCount = categories.reduce((count, category) => count + category.items.length, 0);
      return `<section class="panel" data-vendor="${escapeHtml(definition.vendorIdentifier)}">
        <div class="loading-layer" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        <div class="section-heading"><div class="section-heading-main"><span class="section-kicker">仄 · 子库存 ${String(index + 1).padStart(2, "0")}</span><h2>${escapeHtml(definition.name)}</h2>${definition.description ? `<p class="section-description">${escapeHtml(definition.description)}</p>` : ""}</div><span class="section-summary"><strong>${itemCount}</strong><span>${categories.length} 个分类</span></span></div>
        <div class="inventory-rows">${categories.map(inventoryRowHtml).join("")}</div>
        <p class="source-note">分类名称、分类顺序和售卖条目均由 Bungie 实时数据与 Manifest 动态解析。</p>
      </section>`;
    }).join("");
    const visibleInventoryCount = weeklyItems.length + childEntries.reduce(
      (count, [hash]) => count + activeCategories(hash).reduce((sum, category) => sum + category.items.length, 0),
      0
    );
    document.querySelector(".vendor-row strong").textContent = rootDefinition.name;
    document.querySelector(".vendor-row span").textContent = `高塔 · ${visibleInventoryCount} 个售卖条目`;
    document.getElementById("status-text").textContent = `已解析 ${visibleInventoryCount} 个售卖条目、${rewardItems.length} 个等级奖励和 ${childEntries.length} 个子库存`;

    const tweaks = document.getElementById("tweaks");
    const tweakButton = document.getElementById("tweak-button");
    tweakButton.addEventListener("click", () => {
      const open = tweaks.classList.toggle("is-open");
      tweakButton.setAttribute("aria-expanded", String(open));
      tweakButton.setAttribute("aria-label", open ? "关闭原型状态设置" : "打开原型状态设置");
    });

    document.querySelectorAll("[data-density]").forEach(button => {
      button.addEventListener("click", () => {
        const compact = button.dataset.density === "compact";
        document.body.classList.toggle("is-compact", compact);
        document.querySelectorAll("[data-density]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
      });
    });

    const loadingButton = document.getElementById("loading-button");
    const statusText = document.getElementById("status-text");
    function setLoading(loading) {
      document.body.classList.toggle("is-loading", loading);
      loadingButton.disabled = loading;
      statusText.textContent = loading ? "正在后台刷新当前角色商人数据，已加载页面结构保持可用" : "当前角色库存已就绪，护甲属性按当前机灵护甲师模组读取";
      document.querySelectorAll(".panel").forEach(panel => panel.setAttribute("aria-busy", String(loading)));
      if (loading) setTimeout(() => setLoading(false), 1400);
    }

    loadingButton.addEventListener("click", () => setLoading(true));
    document.getElementById("refresh-button").addEventListener("click", () => setLoading(true));
    document.addEventListener("click", event => {
      const card = event.target.closest("[data-item]");
      if (!card) return;
      statusText.textContent = `${card.dataset.item}：将打开资料库定义详情`;
    });

    if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16, "stroke-width": 1.8 } });
  </script>
  <script async src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" onload="window.lucide?.createIcons({ attrs: { width: 16, height: 16, 'stroke-width': 1.8 } })"></script>
</body>
</html>
