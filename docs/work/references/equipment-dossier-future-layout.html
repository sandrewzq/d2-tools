<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>装备档案整体布局原型</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #080d13;
      --panel: #141b24;
      --surface: #19222d;
      --surface-2: #1e2936;
      --surface-3: #243141;
      --line: #303e4e;
      --line-2: #44566b;
      --text: #edf3f7;
      --body: #c7d1db;
      --muted: #8f9baa;
      --green: #82d9b2;
      --green-bg: #112a22;
      --blue: #8cc7f4;
      --gold: #e1bd72;
      --orange: #dfa36d;
      --danger: #e18f86;
      --radius: 7px;
      font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body { min-height: 100vh; margin: 0; overflow: hidden; color: var(--body); background: var(--page); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .prototype-controls {
      position: fixed;
      z-index: 20;
      top: 12px;
      left: 50%;
      display: flex;
      gap: 5px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #111923;
      box-shadow: 0 12px 30px rgb(0 0 0 / 34%);
      transform: translateX(-50%);
    }
    .prototype-controls button {
      min-height: 40px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
    }
    .prototype-controls button:hover { color: var(--text); background: var(--surface-2); }
    .prototype-controls button[aria-pressed="true"] { color: var(--text); border-color: #4c718d; background: #22384a; }

    .stage { min-height: 100vh; display: grid; place-items: center; padding: 66px 20px 18px; background: rgb(4 8 13 / 72%); }
    .dossier {
      width: min(1680px, calc(100vw - 40px));
      height: min(1000px, calc(100vh - 84px));
      min-height: 720px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgb(0 0 0 / 48%);
    }
    .dossier-toolbar { min-height: 58px; display: flex; justify-content: space-between; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line); }
    .dossier-toolbar h1 { margin: 0; color: var(--text); font-size: 17px; }
    .dossier-toolbar p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .close { min-width: 48px; min-height: 40px; border: 1px solid var(--line-2); border-radius: 6px; color: var(--text); background: var(--surface-2); }
    .dossier-scroll { min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: #53667b #111821; }

    .identity-band { display: grid; grid-template-columns: 72px minmax(280px, 1fr) minmax(480px, auto); gap: 14px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .identity-band img { width: 72px; height: 72px; border-radius: 7px; object-fit: cover; }
    .identity-band h2 { margin: 3px 0; color: var(--text); font-size: 24px; line-height: 1.2; }
    .identity-band p { margin: 0; color: var(--muted); font-size: 12px; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .badge { display: inline-flex; min-height: 22px; align-items: center; padding: 0 7px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font-size: 10px; }
    .badge.ready { color: var(--green); border-color: #367c61; background: var(--green-bg); }
    .commerce-context { display: grid; grid-template-columns: repeat(2, minmax(0, auto)); gap: 7px 18px; justify-content: end; font-size: 11px; }
    .commerce-context span { color: var(--muted); }
    .commerce-context strong { color: var(--text); font-weight: 600; }

    .version-strip { display: grid; grid-template-columns: 130px repeat(3, minmax(0, 1fr)); gap: 1px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: #111821; }
    .version-label, .version-entry { min-width: 0; display: grid; gap: 3px; padding: 8px 10px; }
    .version-label strong, .version-entry strong { color: var(--text); font-size: 11px; }
    .version-label span, .version-entry span { color: var(--muted); font-size: 10px; }
    .version-entry.is-current { border-left: 2px solid var(--green); background: var(--surface); }

    .section-nav {
      position: sticky;
      z-index: 8;
      top: 0;
      display: flex;
      gap: 4px;
      padding: 7px 20px;
      border-bottom: 1px solid var(--line);
      background: #121923;
      box-shadow: 0 8px 18px rgb(0 0 0 / 18%);
    }
    .section-nav button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 5px; color: var(--muted); background: transparent; }
    .section-nav button:hover { color: var(--text); background: var(--surface-2); }
    .section-nav button.is-active { color: var(--text); background: #22384a; }

    .dossier-section { scroll-margin-top: 58px; padding: 20px; border-bottom: 1px solid var(--line); }
    .dossier-section:last-child { border-bottom: 0; }
    .section-heading { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 14px; }
    .section-heading h3 { margin: 0; color: var(--text); font-size: 17px; }
    .section-heading p { max-width: 720px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; text-align: right; }
    .section-kicker { display: block; margin-bottom: 4px; color: var(--blue); font-size: 10px; font-weight: 600; }

    .overview-grid { display: grid; grid-template-columns: minmax(420px, .9fr) minmax(0, 1.4fr); gap: 20px; }
    .stats-panel { min-width: 0; }
    .stat-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 16px; }
    .stat { display: grid; grid-template-columns: 72px 34px minmax(70px, 1fr); gap: 8px; align-items: center; font-size: 11px; }
    .stat span { color: var(--muted); }
    .stat b { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
    .stat i { height: 7px; border-radius: 999px; background: var(--green); }
    .facts-ledger { display: grid; grid-template-columns: 130px minmax(180px, .8fr) minmax(0, 1.4fr); border-top: 1px solid var(--line); }
    .facts-ledger > * { min-width: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .facts-ledger strong { color: var(--text); font-size: 11px; }
    .facts-ledger span { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .facts-ledger .good { color: var(--green); }
    .locate { min-height: 32px; border: 1px solid #51657a; border-radius: 5px; color: var(--text); background: #243142; }

    .weapon-focus-strip { display: grid; grid-template-columns: 1.15fr 1fr .9fr .9fr; margin-bottom: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: #111821; }
    .weapon-focus-strip > div { min-width: 0; display: grid; gap: 4px; padding: 10px 12px; border-right: 1px solid var(--line); }
    .weapon-focus-strip > div:last-child { border-right: 0; }
    .weapon-focus-strip small { color: var(--muted); font-size: 9px; }
    .weapon-focus-strip strong { color: var(--text); font-size: 11px; }
    .weapon-focus-strip span { color: var(--muted); font-size: 9px; line-height: 1.35; }
    .weapon-focus-strip .highlight strong { color: var(--green); }

    .recommendation-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .recommendation-card { min-width: 0; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; padding: 13px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .recommendation-card header { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .recommendation-card h4 { margin: 0; color: var(--text); font-size: 14px; }
    .recommendation-card header span { color: var(--green); font-size: 11px; font-weight: 600; }
    .perk-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
    .perk-token { min-width: 0; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 7px; align-items: center; }
    .perk-token i { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 5px; color: var(--text); background: var(--surface-3); font-style: normal; font-size: 10px; }
    .perk-token strong { overflow: hidden; color: var(--text); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .pair-plus { color: var(--muted); }
    .recommendation-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .evidence-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .evidence { padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-size: 9px; }

    .perk-columns { display: grid; grid-template-columns: minmax(160px, .72fr) repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .perk-column { min-width: 0; display: grid; align-content: start; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .perk-column h4 { margin: 0 0 2px; color: var(--muted); font-size: 11px; }
    .perk { min-width: 0; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; padding: 9px; border: 1px solid #364657; border-radius: 5px; background: var(--surface-2); }
    .perk-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 5px; color: #e7eff5; background: #2b3745; font-size: 10px; font-weight: 700; }
    .perk strong { display: block; color: var(--text); font-size: 12px; }
    .perk p { margin: 3px 0 0; color: var(--muted); font-size: 10px; line-height: 1.35; }

    .upgrade-grid { display: grid; grid-template-columns: 1fr 1.25fr; gap: 20px; }
    .choice-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .choice-grid.mods { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .choice { min-width: 0; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 9px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    .choice-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 5px; color: var(--gold); background: #332f22; font-size: 10px; font-weight: 700; }
    .choice strong { display: block; color: var(--text); font-size: 11px; }
    .choice span { color: var(--muted); font-size: 9px; }

    .ai-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, .8fr); gap: 20px; }
    .ai-analysis { display: grid; gap: 12px; }
    .ai-label { display: inline-flex; width: fit-content; min-height: 22px; align-items: center; padding: 0 7px; border: 1px solid #5665a1; border-radius: 5px; color: #bfc8ff; background: #202640; font-size: 10px; }
    .ai-analysis h4 { margin: 0; color: var(--text); font-size: 16px; }
    .ai-analysis p { max-width: 760px; margin: 0; color: var(--body); font-size: 12px; line-height: 1.65; }
    .ai-evidence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .ai-evidence div { display: grid; gap: 4px; padding: 10px; border-top: 1px solid var(--line); }
    .ai-evidence small { color: var(--muted); font-size: 9px; }
    .ai-evidence strong { color: var(--text); font-size: 11px; }
    .ai-tools { display: grid; gap: 10px; align-content: start; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .ai-tools label { color: var(--text); font-size: 11px; font-weight: 600; }
    .ai-tools input { width: 100%; min-height: 42px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 5px; color: var(--text); background: #111821; }
    .ai-action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .ai-action-grid button { min-height: 38px; border: 1px solid var(--line); border-radius: 5px; color: var(--body); background: var(--surface-2); }
    .ai-action-grid button:hover { color: var(--text); border-color: #60758b; }
    .ai-disclaimer { color: var(--muted); font-size: 9px; line-height: 1.4; }

    .armor-core-grid { display: grid; grid-template-columns: minmax(360px, .9fr) minmax(0, 1.3fr); gap: 20px; }
    .intrinsic-block { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 13px; align-items: start; }
    .intrinsic-icon { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 6px; color: var(--gold); background: #353122; font-weight: 700; }
    .intrinsic-block h4 { margin: 0; color: var(--text); font-size: 17px; }
    .intrinsic-block p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .target-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .target-card { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .target-card h4 { margin: 0; color: var(--text); font-size: 13px; }
    .target-card p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.45; }

    @media (max-width: 1200px) {
      .identity-band { grid-template-columns: 72px minmax(0, 1fr); }
      .commerce-context { grid-column: 1 / -1; justify-content: start; }
      .overview-grid, .upgrade-grid, .ai-layout, .armor-core-grid { grid-template-columns: 1fr; }
      .weapon-focus-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .weapon-focus-strip > div:nth-child(2) { border-right: 0; }
      .weapon-focus-strip > div:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
      .recommendation-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .perk-columns { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .choice-grid, .choice-grid.mods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

  <template id="armor-template">
    <section class="identity-band"><img src="https://www.bungie.net/common/destiny2_content/icons/220fda89a88058f84725ff1df39a9f5e.jpg" alt="炎阳护腕"><div><span class="badge ready">来源可确认</span><h2>炎阳护腕</h2><p>异域 / 臂铠 / 术士 / 护甲</p><div class="badge-row"><span class="badge">Hash 950745251</span><span class="badge">当前可获取</span><span class="badge">已拥有 2 件</span></div></div><div class="commerce-context"><span>商人 <strong>仄 → 奇异装备优惠</strong></span><span>价格 <strong>23 奇异硬币</strong></span><span>当前售卖属性 <strong>总计 69</strong></span><span>账号位置 <strong>仓库 / 术士背包</strong></span></div></section>
    <section class="version-strip"><div class="version-label"><strong>护甲状态</strong><span>定义与当前售卖实例</span></div><div class="version-entry is-current"><strong>当前售卖</strong><span>恢复 17 · 纪律 18 · 总计 69</span></div><div class="version-entry"><strong>仓库实例</strong><span>总计 66 · 当前未展开</span></div><div class="version-entry"><strong>术士背包</strong><span>总计 64 · 当前未展开</span></div></section>
    <nav class="section-nav"><button type="button" data-section-target="overview" class="is-active">概览</button><button type="button" data-section-target="recommendations">构筑方向</button><button type="button" data-section-target="pool">固有特性</button><button type="button" data-section-target="upgrades">模组建议</button><button type="button" data-section-target="ai">AI 分析</button></nav>
